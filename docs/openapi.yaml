openapi: 3.1.0
info:
  title: Coffee Shop API
  version: 0.1.0
  description: Endpoints are added phase by phase — see plan.md §3.
servers:
  - url: http://localhost:3000
paths:
  /api/health:
    get:
      summary: Liveness check
      operationId: getHealth
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status, time]
                properties:
                  status: { type: string, const: ok }
                  time: { type: string, format: date-time }
components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 Problem Details
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
